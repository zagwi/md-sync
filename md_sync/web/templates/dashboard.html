<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>md-sync · {{ project }}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card h2 { font-size: 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 13px; }
  th { font-weight: 600; color: #555; }
  .btn { padding: 8px 20px; background: #222; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .btn:hover { background: #444; }
  .ok { color: #22c55e; }
  .pending { color: #f59e0b; }
</style>
</head>
<body>

<h1>md-sync</h1>
<p style="color:#666; margin-bottom:20px;">{{ project }}</p>

<div class="card">
  <h2>源文件</h2>
  <p><code>{{ info.source }}</code></p>
  <p style="font-size:13px; color:#666; margin-top:8px;">
    章节：
    {% for sec in info.sections %}
    <span style="display:inline-block; background:#f0f0f0; padding:2px 10px; border-radius:4px; margin:2px;">
      {{ sec.title }} <strong>{{ sec.items }}</strong>
    </span>
    {% endfor %}
  </p>
</div>

<div class="card">
  <h2>输出文件</h2>
  <table>
    <tr><th>格式</th><th>语言</th><th>文件</th><th>PDF</th></tr>
    {% for out in outputs %}
    <tr>
      <td>{{ out.format }}</td>
      <td>{{ out.lang }}</td>
      <td><code>{{ out.path }}</code></td>
      <td>{{ 'OK' if out.pdf else '--' }}</td>
    </tr>
    {% endfor %}
  </table>
  <div style="margin-top:12px;">
    <button class="btn" onclick="syncNow()">立即同步</button>
    <span id="result" style="margin-left:12px; font-size:13px;"></span>
  </div>
</div>

<script>
async function syncNow() {
  const btn = document.querySelector('.btn');
  btn.disabled = true;
  document.getElementById('result').textContent = '同步中...';
  const resp = await fetch('/api/sync', { method: 'POST' });
  const data = await resp.json();
  if (data.status === 'ok') {
    document.getElementById('result').textContent = 'OK ' + data.elapsed.toFixed(1) + 's';
    setTimeout(() => location.reload(), 1500);
  }
}
</script>

</body>
</html>

name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executable
        run: python scripts/build_app.py

      - name: Upload artifact (Linux / macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: md-sync-${{ matrix.os }}
          path: dist/md-sync
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: md-sync-${{ matrix.os }}
          path: dist/md-sync.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage binaries
        run: |
          mkdir -p release
          cp artifacts/md-sync release/md-sync-linux
          cp artifacts/md-sync.exe release/md-sync-windows.exe
          cp artifacts/md-sync release/md-sync-macos
          chmod +x release/md-sync-linux release/md-sync-macos
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*

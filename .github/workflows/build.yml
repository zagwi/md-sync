name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executable
        run: python scripts/build_web.py

      - name: Upload artifact (Linux / macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: md-sync-web-${{ matrix.os }}
          path: dist/md-sync-web
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: md-sync-web-${{ matrix.os }}
          path: dist/md-sync-web.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: md-sync-web-ubuntu-latest
          path: artifacts/linux
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: md-sync-web-macos-latest
          path: artifacts/macos
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: md-sync-web-windows-latest
          path: artifacts/windows
      - name: Stage binaries
        run: |
          mkdir -p release
          cp artifacts/linux/md-sync-web release/md-sync-web-linux
          cp artifacts/windows/md-sync-web.exe release/md-sync-web-windows.exe
          cp artifacts/macos/md-sync-web release/md-sync-web-macos
          chmod +x release/md-sync-web-linux release/md-sync-web-macos
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*

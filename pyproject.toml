[project]
name = "md-sync"
version = "0.1.0"
description = "Markdown source file watcher — auto-sync to multi-format, multi-language outputs"
authors = [{ name = "md-sync" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["markdown", "sync", "translation", "html", "resume", "static-site"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "watchdog>=3.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/md-sync/md-sync"
Repository = "https://github.com/md-sync/md-sync"
Documentation = "https://github.com/md-sync/md-sync#readme"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
]

[project.scripts]
md-sync = "md_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["md_sync*"]

[tool.setuptools.package-data]
md_sync = [
    "plugins/**/*",
    "web/templates/**/*",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["md_sync"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "PTH"]
ignore = ["E501", "F403", "F405", "E402", "B027", "C401", "SIM102", "SIM110", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "PTH"]
"md_sync/qt_app.py" = ["B", "SIM", "PTH"]
"md_sync/web/app.py" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
